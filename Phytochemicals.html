<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>來點顏色瞧瞧—植化素</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceIn {
      0% { transform: scale(0.9); opacity: 0; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    .animate-bounce-in {
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-10 min-h-screen">
  
  <!-- 應用程式根節點 -->
  <div id="app"></div>

  <script>
    // 植化素與蔬果資料庫 (嚴格排除肉食與五辛白色蔬菜)
    const phytoData = [
      {
        id: 'red',
        colorName: '紅色',
        bgColor: 'bg-red-500',
        hoverColor: 'hover:bg-red-600',
        textColor: 'text-red-600',
        borderColor: 'border-red-200',
        phytochemical: '茄紅素、花青素',
        benefits: ['強效抗氧化', '保護心血管', '維護攝護腺健康'],
        foods: ['番茄', '西瓜', '紅甜椒', '草莓', '櫻桃', '紅石榴', '蔓越莓', '紅莧菜', '紅龍果'],
        emoji: '🍅🍉🍓🍒🍎',
        description: '紅色蔬果就像身體的滅火器，能對抗體內的自由基！'
      },
      {
        id: 'orange',
        colorName: '黃橘色',
        bgColor: 'bg-orange-500',
        hoverColor: 'hover:bg-orange-600',
        textColor: 'text-orange-600',
        borderColor: 'border-orange-200',
        phytochemical: 'β-胡蘿蔔素、葉黃素',
        benefits: ['保護眼睛視力', '維持皮膚與黏膜健康', '增強身體免疫力'],
        foods: ['胡蘿蔔', '南瓜', '玉米', '木瓜', '黃甜椒', '地瓜', '芒果', '柑橘', '鳳梨'],
        emoji: '🥕🎃🌽🍊🍍',
        description: '黃橘色蔬果是眼睛的守護神，也能讓皮膚保持水潤漂亮喔！'
      },
      {
        id: 'green',
        colorName: '綠色',
        bgColor: 'bg-green-500',
        hoverColor: 'hover:bg-green-600',
        textColor: 'text-green-600',
        borderColor: 'border-green-200',
        phytochemical: '葉綠素、兒茶素、葉酸',
        benefits: ['幫助肝臟排毒', '強效抗氧化', '維護骨骼與牙齒健康'],
        foods: ['菠菜', '花椰菜', '奇異果', '芭樂', '蘆筍', '秋葵', '小黃瓜', '地瓜葉', '綠青椒'],
        emoji: '🥦🥝🥬🥒🟢',
        description: '綠色是自然界中最常見的顏色，是身體清道夫，幫助排出不好的物質。'
      },
      {
        id: 'purple',
        colorName: '紫黑色',
        bgColor: 'bg-purple-600',
        hoverColor: 'hover:bg-purple-700',
        textColor: 'text-purple-600',
        borderColor: 'border-purple-200',
        phytochemical: '花青素、白藜蘆醇',
        benefits: ['極佳抗氧化劑', '保護微血管與眼睛', '維持記憶力與抗老化'],
        foods: ['茄子', '葡萄', '藍莓', '黑木耳', '紫甘藍', '桑椹', '黑芝麻', '紫地瓜', '黑豆'],
        emoji: '🍆🍇🫐🖤🟣',
        description: '紫黑色蔬果是抗老精靈！對於常用3C產品的現代人來說非常重要。'
      },
      {
        id: 'white',
        colorName: '白色',
        bgColor: 'bg-slate-100',
        hoverColor: 'hover:bg-slate-200',
        textColor: 'text-slate-700',
        borderColor: 'border-slate-300',
        phytochemical: '有機硫化物、多醣體',
        benefits: ['降低發炎反應', '保護呼吸道健康', '提升免疫防禦力'],
        foods: ['白蘿蔔', '高麗菜', '山藥', '蓮藕', '白花椰菜', '馬鈴薯', '竹筍', '杏鮑菇', '白木耳', '冬瓜'],
        emoji: '🍄🥔🥬⚪️🥟',
        description: '非五辛的白色蔬果含有豐富多醣體與膳食纖維，是溫和又強大的防禦力量！'
      }
    ];

    const GAME_TIME = 60; // 遊戲總時間 (秒)

    // 精選 30 道不重複的題庫
    const questionBank = [
      { text: "哪種顏色的蔬果富含「茄紅素」，就像身體的滅火器？", correctId: "red" },
      { text: "如果你想「保護心血管」，多吃哪種顏色的蔬果最合適？", correctId: "red" },
      { text: "如果你想「維護攝護腺健康」，應該多吃哪種顏色的蔬果？", correctId: "red" },
      { text: "「番茄」屬於哪種顏色，能幫助對抗體內的自由基？", correctId: "red" },
      { text: "「紅石榴」與「蔓越莓」屬於哪種顏色，提供專屬的植化素？", correctId: "red" },
      { text: "「草莓」與「櫻桃」在植化素分類中屬於哪種顏色？", correctId: "red" },
      { text: "哪種顏色的蔬果富含「β-胡蘿蔔素」，是眼睛的守護神？", correctId: "orange" },
      { text: "哪種顏色的蔬果富含「葉黃素」？", correctId: "orange" },
      { text: "如果你想「維持皮膚與黏膜健康」，多吃哪種顏色？", correctId: "orange" },
      { text: "「胡蘿蔔」屬於哪種顏色，能讓皮膚保持水潤漂亮？", correctId: "orange" },
      { text: "「南瓜」屬於哪種顏色分類？", correctId: "orange" },
      { text: "「芒果」與「鳳梨」屬於哪種顏色分類？", correctId: "orange" },
      { text: "哪種顏色的蔬果富含「葉綠素」，是身體的清道夫？", correctId: "green" },
      { text: "哪種顏色的蔬果富含「兒茶素」或「葉酸」？", correctId: "green" },
      { text: "如果你想「幫助肝臟排毒」，應該多攝取哪種顏色的蔬果？", correctId: "green" },
      { text: "「菠菜」屬於哪種顏色，能幫助排出不好的物質？", correctId: "green" },
      { text: "「奇異果」屬於哪種顏色分類？", correctId: "green" },
      { text: "「芭樂」與「蘆筍」屬於哪種顏色，能強效抗氧化？", correctId: "green" },
      { text: "哪種顏色的蔬果富含「白藜蘆醇」與花青素，是抗老精靈？", correctId: "purple" },
      { text: "對於常用3C產品的現代人，想「保護微血管與眼睛」該吃什麼顏色？", correctId: "purple" },
      { text: "如果你想「維持記憶力與抗老化」，多吃哪種顏色的蔬果？", correctId: "purple" },
      { text: "「茄子」屬於哪種顏色分類？", correctId: "purple" },
      { text: "「藍莓」與「葡萄」屬於哪種顏色，能提供極佳抗氧化劑？", correctId: "purple" },
      { text: "「黑木耳」與「黑芝麻」在植化素分類中屬於哪種顏色？", correctId: "purple" },
      { text: "哪種顏色的蔬果富含「有機硫化物」，是溫和又強大的防禦力量？", correctId: "white" },
      { text: "哪種顏色的蔬果富含豐富的「多醣體」？", correctId: "white" },
      { text: "如果你想「降低發炎反應」並保護呼吸道，多吃哪種顏色？", correctId: "white" },
      { text: "「白蘿蔔」屬於哪種顏色分類？", correctId: "white" },
      { text: "「山藥」與「蓮藕」屬於哪種顏色分類？", correctId: "white" },
      { text: "「冬瓜」與「白木耳」屬於哪種顏色分類？", correctId: "white" }
    ];

    // 全域狀態變數
    let activeTab = 'learn';
    let selectedColor = phytoData[0];
    
    let currentQuestion = null;
    let score = 0;
    let questionCount = 0;
    let feedback = null;
    
    let shuffledQuestions = [];
    let currentQuestionIndex = 0;
    let timeLeft = GAME_TIME;
    let isGameActive = false;
    let isGameOver = false;
    let wrongAnswers = [];
    let timerRef = null;

    // 工具函數：格式化時間
    const formatTime = (seconds) => {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    // 工具函數：計算正確率
    const calculateAccuracy = () => {
      if (questionCount === 0) return 0;
      return Math.round((score / questionCount) * 100);
    };

    // 介面控制：切換分頁
    window.setActiveTab = (tab) => {
      activeTab = tab;
      if (tab === 'learn') {
        isGameActive = false;
        clearInterval(timerRef);
      }
      renderApp();
    };

    // 介面控制：選擇顏色 (圖鑑)
    window.selectColor = (colorId) => {
      selectedColor = phytoData.find(c => c.id === colorId);
      renderApp();
    };

    // 遊戲控制：載入題目
    const loadQuestion = (questionsList, index) => {
      if (index >= questionsList.length) {
        endGame();
        return;
      }
      currentQuestion = questionsList[index];
      feedback = null;
      renderApp();
    };

    // 遊戲控制：開始遊戲
    window.startGame = () => {
      shuffledQuestions = [...questionBank].sort(() => Math.random() - 0.5);
      currentQuestionIndex = 0;
      score = 0;
      questionCount = 0;
      timeLeft = GAME_TIME;
      isGameActive = true;
      isGameOver = false;
      wrongAnswers = [];
      
      loadQuestion(shuffledQuestions, currentQuestionIndex);
      
      clearInterval(timerRef);
      timerRef = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          endGame();
        } else {
          updateTimerDisplay(); // 避免每秒重繪整個畫面
        }
      }, 1000);
    };

    // 遊戲控制：結束遊戲
    const endGame = () => {
      isGameActive = false;
      isGameOver = true;
      clearInterval(timerRef);
      renderApp();
    };

    // 遊戲控制：回答問題
    window.handleAnswer = (colorId) => {
      if (feedback || !isGameActive) return;

      const isCorrect = colorId === currentQuestion.correctId;
      const correctColorObj = phytoData.find(c => c.id === currentQuestion.correctId);
      const userColorObj = phytoData.find(c => c.id === colorId);

      if (isCorrect) {
        score++;
        feedback = { isCorrect: true, message: '答對了！🎉' };
      } else {
        wrongAnswers.push({
          question: currentQuestion.text,
          userAnswer: userColorObj.colorName,
          correctAnswer: correctColorObj.colorName
        });
        feedback = { isCorrect: false, message: `答錯！答案是「${correctColorObj.colorName}」。` };
      }
      
      questionCount++;
      renderApp();

      if (timeLeft > 0) {
        setTimeout(() => {
          if (isGameActive) {
            currentQuestionIndex++;
            loadQuestion(shuffledQuestions, currentQuestionIndex);
          }
        }, 600); // 縮短答題回饋停留時間至0.6秒
      }
    };

    // DOM 更新：局部更新計時器 (避免閃爍)
    const updateTimerDisplay = () => {
      const timeSpan = document.getElementById('timer-text');
      const timeContainer = document.getElementById('timer-container');
      const timeIcon = document.getElementById('timer-icon');
      
      if (timeSpan) {
        timeSpan.innerText = formatTime(timeLeft);
        if (timeLeft <= 10) {
          timeSpan.classList.add('text-red-600');
          if (timeIcon) timeIcon.classList.add('animate-pulse', 'text-red-600');
        }
      }
    };

    // 畫面渲染：主要函數
    const renderApp = () => {
      const appEl = document.getElementById('app');
      
      let contentHtml = '';

      // --- 圖鑑模式 (Learn) ---
      if (activeTab === 'learn') {
        const bdTopClass = selectedColor.borderColor.replace('border-', 'border-t-').replace('200', '500');
        
        contentHtml = `
          <div class="animate-fade-in px-2">
            <h2 class="text-lg md:text-xl font-bold mb-4 text-center text-slate-700">點擊顏色，發掘彩虹蔬果秘密！</h2>
            
            <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-6">
              ${phytoData.map(color => `
                <button onclick="window.selectColor('${color.id}')"
                  class="w-14 h-14 md:w-20 md:h-20 rounded-full flex items-center justify-center text-2xl md:text-4xl shadow-md transition-transform hover:scale-110 focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-slate-200 
                  ${color.bgColor} ${color.id === 'white' ? 'border-2 border-slate-300' : ''} 
                  ${selectedColor.id === color.id ? 'ring-4 ring-offset-2 ring-slate-400 scale-110' : ''}"
                  aria-label="${color.colorName}">
                  <span class="drop-shadow-md">${color.emoji.substring(0, 2)}</span>
                </button>
              `).join('')}
            </div>

            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-t-8 ${bdTopClass}">
              <div class="p-5 md:p-8">
                <div class="flex items-center gap-3 md:gap-4 mb-5">
                  <div class="w-12 h-12 md:w-16 md:h-16 shrink-0 rounded-full flex items-center justify-center text-2xl md:text-3xl shadow-inner ${selectedColor.bgColor} ${selectedColor.id === 'white' ? 'border border-slate-300' : ''}">
                    ${selectedColor.emoji.substring(0,2)}
                  </div>
                  <div>
                    <h3 class="text-xl md:text-3xl font-extrabold ${selectedColor.textColor}">
                      ${selectedColor.colorName}力量
                    </h3>
                    <p class="text-sm md:text-base text-slate-500 font-medium leading-snug mt-1">${selectedColor.description}</p>
                  </div>
                </div>

                <div class="grid md:grid-cols-2 gap-4 md:gap-8">
                  <div class="space-y-4 md:space-y-6">
                    <div class="bg-slate-50 p-4 md:p-5 rounded-xl border border-slate-100">
                      <h4 class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-wider mb-1 md:mb-2">主要植化素</h4>
                      <p class="text-lg md:text-xl font-bold ${selectedColor.textColor}">${selectedColor.phytochemical}</p>
                    </div>
                    <div>
                      <h4 class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 md:mb-3">代表蔬果 (${selectedColor.foods.length}種)</h4>
                      <div class="flex flex-wrap gap-1.5 md:gap-2">
                        ${selectedColor.foods.map(food => `
                          <span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full text-xs md:text-sm font-medium">${food}</span>
                        `).join('')}
                      </div>
                    </div>
                  </div>

                  <div class="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-100">
                    <h4 class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 md:mb-4">對身體的好處</h4>
                    <ul class="space-y-3 md:space-y-4">
                      ${selectedColor.benefits.map(benefit => `
                        <li class="flex items-start gap-2 md:gap-3">
                          <i data-lucide="check-circle-2" class="w-5 h-5 md:w-6 md:h-6 shrink-0 mt-0.5 ${selectedColor.textColor}"></i>
                          <span class="text-slate-700 font-medium text-base md:text-lg leading-tight">${benefit}</span>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } 
      // --- 測驗模式 (Quiz) ---
      else if (activeTab === 'quiz') {
        if (!isGameActive && !isGameOver) {
          contentHtml = `
            <div class="max-w-2xl mx-auto animate-fade-in px-2">
              <div class="bg-white rounded-2xl shadow-lg p-8 text-center border-t-8 border-indigo-500">
                <i data-lucide="help-circle" class="w-16 h-16 text-indigo-500 mx-auto mb-4 opacity-80 inline-block"></i>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">顏色小測驗挑戰</h2>
                <p class="text-slate-500 mb-6">您有 <strong class="text-indigo-600 text-lg">60 秒</strong> 的時間，看看能答對幾題！</p>
                <button onclick="window.startGame()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full text-lg shadow-md transition-all hover:scale-105">
                  開始挑戰
                </button>
              </div>
            </div>
          `;
        } else if (isGameActive && currentQuestion) {
          contentHtml = `
            <div class="max-w-2xl mx-auto animate-fade-in px-2">
              <div class="bg-white rounded-xl shadow-sm p-3 md:p-4 grid grid-cols-3 gap-2 text-center mb-4 md:mb-6 border border-slate-200">
                <div id="timer-container" class="flex items-center justify-center gap-1.5 text-rose-600 font-bold bg-rose-50 py-1 rounded-full">
                  <i id="timer-icon" data-lucide="timer" class="w-4 h-4 md:w-5 md:h-5 ${timeLeft <= 10 ? 'animate-pulse text-red-600' : ''}"></i>
                  <span id="timer-text" class="text-base md:text-lg ${timeLeft <= 10 ? 'text-red-600' : ''}">${formatTime(timeLeft)}</span>
                </div>
                <div class="text-indigo-600 font-bold text-base md:text-lg bg-indigo-50 py-1 rounded-full">
                  得分: ${score}
                </div>
                <div class="text-emerald-600 font-bold text-base md:text-lg bg-emerald-50 py-1 rounded-full flex items-center justify-center gap-1">
                  <i data-lucide="percent" class="w-4 h-4 md:w-5 md:h-5"></i>
                  正確率: ${calculateAccuracy()}%
                </div>
              </div>

              <div class="bg-white rounded-2xl shadow-lg p-5 md:p-8 mb-6 text-center border-t-8 border-t-indigo-500 relative overflow-hidden">
                ${feedback ? `
                  <div class="absolute inset-0 z-10 flex flex-col items-center justify-center animate-fade-in ${feedback.isCorrect ? 'bg-green-100/95 text-green-800' : 'bg-red-100/95 text-red-800'}">
                    <i data-lucide="${feedback.isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-14 h-14 ${feedback.isCorrect ? 'text-green-500' : 'text-red-500'} mb-1 animate-bounce-in"></i>
                    <p class="text-lg md:text-xl font-bold">${feedback.message}</p>
                  </div>
                ` : ''}

                <h2 class="text-lg md:text-2xl font-bold text-slate-800 mb-6 md:mb-8 leading-relaxed min-h-[4rem] flex items-center justify-center">
                  ${currentQuestion.text}
                </h2>
                
                <div class="grid grid-cols-5 gap-1.5 md:gap-4">
                  ${phytoData.map(color => `
                    <button onclick="window.handleAnswer('${color.id}')" ${feedback !== null ? 'disabled' : ''}
                      class="flex flex-col items-center justify-center py-2.5 px-1 rounded-lg md:rounded-xl transition-all shadow-sm border-2 
                      ${color.bgColor} ${color.id === 'white' ? 'border-slate-300' : 'border-transparent'} 
                      ${feedback === null ? 'hover:-translate-y-1 hover:shadow-md cursor-pointer' : 'cursor-default'}">
                      <span class="text-xl md:text-3xl mb-1 drop-shadow-sm">${color.emoji.substring(0, 2)}</span>
                      <span class="text-[10px] md:text-base font-bold whitespace-nowrap ${color.id === 'white' ? 'text-slate-700' : 'text-white drop-shadow-md'}">
                        ${color.colorName}
                      </span>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        } else if (isGameOver) {
          contentHtml = `
            <div class="max-w-2xl mx-auto animate-fade-in px-2">
              <div class="bg-white rounded-2xl shadow-lg p-8 text-center border-t-8 border-amber-400 animate-bounce-in">
                <i data-lucide="trophy" class="w-20 h-20 text-amber-400 mx-auto mb-4 inline-block"></i>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">
                  ${questionCount >= 30 ? "太強了！全部答完！" : "時間到！"}
                </h2>
                <div class="bg-slate-50 rounded-xl p-6 my-6 border border-slate-100 space-y-3">
                  <p class="text-slate-500 text-lg">你總共挑戰了 <strong class="text-slate-800">${questionCount}</strong> 題</p>
                  <p class="text-2xl font-bold text-indigo-600">
                    答對題數： <span class="text-3xl">${score}</span> 題
                  </p>
                  <div class="inline-flex items-center gap-1.5 text-xl font-bold text-emerald-600 bg-emerald-50 px-4 py-1.5 rounded-full">
                    <i data-lucide="percent" class="w-5 h-5"></i>
                    最終正確率： ${calculateAccuracy()}%
                  </div>
                </div>

                ${wrongAnswers.length > 0 ? `
                  <div class="mb-6 text-left bg-red-50 rounded-xl p-4 md:p-5 border border-red-100 max-h-60 overflow-y-auto shadow-inner">
                    <h3 class="font-bold text-red-800 mb-3 flex items-center gap-2 text-lg">
                      <i data-lucide="book-open" class="w-5 h-5"></i> 錯題重點複習
                    </h3>
                    <ul class="space-y-3">
                      ${wrongAnswers.map(item => `
                        <li class="bg-white p-3 md:p-4 rounded-lg shadow-sm border border-red-50">
                          <p class="font-bold text-slate-800 mb-2 leading-snug">${item.question}</p>
                          <div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-4 text-sm md:text-base">
                            <span class="text-slate-500 flex items-center gap-1">
                              <i data-lucide="x-circle" class="w-4 h-4 text-red-400"></i>
                              你的答案: <span class="line-through">${item.userAnswer}</span>
                            </span>
                            <span class="text-emerald-600 font-bold flex items-center gap-1">
                              <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                              正確答案: ${item.correctAnswer}
                            </span>
                          </div>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                ` : ''}
                
                <div class="flex flex-col sm:flex-row justify-center gap-4">
                  <button onclick="window.startGame()" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-md transition-all">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i> 再玩一次
                  </button>
                  <button onclick="window.setActiveTab('learn')" class="flex items-center justify-center gap-2 bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50 font-bold py-3 px-6 rounded-full transition-all">
                    <i data-lucide="book-open" class="w-5 h-5"></i> 回去複習
                  </button>
                </div>
              </div>
            </div>
          `;
        }
      }

      // 整體結構組合
      appEl.innerHTML = `
        <header class="bg-white shadow-sm py-4 md:py-6 px-4 text-center sticky top-0 z-10">
          <h1 class="text-2xl md:text-4xl font-bold mb-1 md:mb-2 flex items-center justify-center gap-2">
            🌈 來點顏色瞧瞧
          </h1>
          <p class="text-sm md:text-base text-slate-500 font-medium">認識神奇的植物性營養素「植化素」</p>
        </header>

        <main class="max-w-4xl mx-auto px-2 md:px-4 mt-6">
          <div class="flex bg-slate-200 p-1 rounded-xl mb-6 max-w-sm mx-auto">
            <button onclick="window.setActiveTab('learn')" class="flex-1 py-2 md:py-3 px-2 md:px-4 rounded-lg font-bold flex items-center justify-center gap-1 md:gap-2 transition-all text-sm md:text-base ${activeTab === 'learn' ? 'bg-white text-emerald-600 shadow-md' : 'text-slate-500 hover:bg-slate-300'}">
              <i data-lucide="book-open" class="w-4 h-4 md:w-5 md:h-5"></i>
              植化素圖鑑
            </button>
            <button onclick="window.setActiveTab('quiz')" class="flex-1 py-2 md:py-3 px-2 md:px-4 rounded-lg font-bold flex items-center justify-center gap-1 md:gap-2 transition-all text-sm md:text-base ${activeTab === 'quiz' ? 'bg-white text-indigo-600 shadow-md' : 'text-slate-500 hover:bg-slate-300'}">
              <i data-lucide="help-circle" class="w-4 h-4 md:w-5 md:h-5"></i>
              顏色小測驗
            </button>
          </div>
          ${contentHtml}
        </main>
      `;

      // 初始化 Lucide 圖示
      lucide.createIcons();
    };

    // 啟動應用程式
    renderApp();
  </script>
</body>
</html>
