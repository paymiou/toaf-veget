<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔬食小樹日記 - 雲端養成版</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f0f7f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .app-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(46, 90, 53, 0.1);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            text-align: center;
        }
        .header {
            padding: 18px 20px 12px;
            background: #e8f5e9;
            border-bottom: 1px solid #c8e6c9;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #2e7d32;
        }
        .user-bar {
            margin-top: 8px;
            font-size: 12px;
            color: #4a7050;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.6);
            padding: 6px 12px;
            border-radius: 12px;
        }
        .sync-btn {
            color: #2e7d32;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            color: #388e3c;
            font-size: 13px;
        }
        .stat-box strong {
            display: block;
            font-size: 18px;
            color: #1b5e20;
            margin-top: 2px;
        }
        .canvas-container {
            position: relative;
            background: linear-gradient(to bottom, #e8f5e9 0%, #ffffff 80%, #d7ccc8 80%, #a1887f 100%);
            height: 340px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        canvas { display: block; }
        .controls { padding: 20px; }
        .btn-action {
            background: linear-gradient(135deg, #66bb6a, #43a047);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(67, 160, 71, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 320px;
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 160, 71, 0.4);
        }
        .btn-action:disabled {
            background: #bdbdbd;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-harvest {
            background: linear-gradient(135deg, #ffa726, #fb8c00) !important;
            box-shadow: 0 4px 12px rgba(251, 140, 0, 0.3) !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .message {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            min-height: 18px;
        }
        .gallery-section {
            border-top: 1px dashed #e0e0e0;
            padding: 15px 20px 20px;
            background: #fafafa;
        }
        .gallery-title {
            font-size: 14px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .animals-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .animal-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 8px 4px;
            font-size: 11px;
            color: #757575;
        }
        .animal-card.unlocked {
            border-color: #81c784;
            background: #f1f8e9;
            color: #2e7d32;
            font-weight: bold;
        }
        .animal-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
            filter: grayscale(100%);
            opacity: 0.3;
        }
        .animal-card.unlocked .animal-icon {
            filter: grayscale(0%);
            opacity: 1;
        }
        .sync-status {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>🥗 蔬食養成日記</h1>
        <div class="user-bar">
            <span>👤 玩家：<strong id="displayNickname">尚未設定</strong></span>
            <span class="sync-btn" onclick="loadCloudDataPrompt()">☁️ 讀取舊雲端進度</span>
        </div>
        <div class="stats">
            <div class="stat-box">今日蔬食<strong id="todayVeg">0 / 3 次</strong></div>
            <div class="stat-box">小樹進度<strong id="progress">0 / 15</strong></div>
            <div class="stat-box">累積大樹<strong id="treeCount">0 棵</strong></div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="treeCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="actionBtn" class="btn-action" onclick="handleAction()">🥗 我今天吃蔬食</button>
        <div id="message" class="message"></div>
        <div id="syncStatus" class="sync-status"></div>
    </div>

    <div class="gallery-section">
        <div class="gallery-title">
            <span>🐾 森林動物圖鑑</span>
            <span id="animalProgress" style="font-size:12px; font-weight:normal; color:#666;">(0/4 解鎖)</span>
        </div>
        <div class="animals-grid" id="animalsGrid"></div>
    </div>
</div>

<script>
    // 🔗 請將您部署 Apps Script 獲得的 URL 貼在下面：
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRilBMphU9Ck8ScCDmlMUwM7eN0BgzcEloteFi8YoO7TSlosgZNDIQRxQObPqBVToz/exec";

    const MAX_DAILY_CLICKS = 3;
    const MAX_TREE_CLICKS = 15;

    const ANIMAL_LIST = [
        { name: "萌萌兔", icon: "🐰", requiredTrees: 3 },
        { name: "靈巧松鼠", icon: "🐿️", requiredTrees: 6 },
        { name: "溫和梅花鹿", icon: "🦌", requiredTrees: 9 },
        { name: "溫馨刺蝟", icon: "🦔", requiredTrees: 12 }
    ];

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const logicalWidth = 400;
    const logicalHeight = 340;
    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = '100%';
    canvas.style.maxWidth = `${logicalWidth}px`;
    canvas.style.height = `${logicalHeight}px`;
    canvas.width = logicalWidth * dpr;
    canvas.height = logicalHeight * dpr;
    ctx.scale(dpr, dpr);

    let nickname = localStorage.getItem('veg_nickname') || '';
    let pin = localStorage.getItem('veg_pin') || '';
    let todayClicks = parseInt(localStorage.getItem('veg_todayClicks')) || 0;
    let lastDate = localStorage.getItem('veg_lastDate') || '';
    let currentTreeClicks = parseInt(localStorage.getItem('veg_currentTreeClicks')) || 0;
    let totalTreesCollected = parseInt(localStorage.getItem('veg_treesCollected')) || 0;
    let treeSeed = parseInt(localStorage.getItem('veg_treeSeed')) || Math.floor(Math.random() * 100000);

    let currentGrowth = currentTreeClicks;
    let targetGrowth = currentTreeClicks;
    let isAnimating = false;
    let particles = [];
    let currentPRNGState = treeSeed;

    function seededRandom() {
        currentPRNGState = (currentPRNGState * 9301 + 49297) % 233280;
        return currentPRNGState / 233280;
    }

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    }

    function checkUserCredentials() {
        if (!nickname || !pin) {
            nickname = prompt('歡迎來到蔬食日記！請輸入您的「暱稱」：') || `蔬食愛好者${Math.floor(Math.random()*1000)}`;
            pin = prompt('請輸入您的「手機後 3 碼」（用於換手機時撈回進度）：') || '000';
            
            localStorage.setItem('veg_nickname', nickname);
            localStorage.setItem('veg_pin', pin);
        }
        document.getElementById('displayNickname').textContent = nickname;
    }

    function checkDailyReset() {
        const today = getTodayString();
        if (lastDate !== today) {
            todayClicks = 0;
            lastDate = today;
            saveLocalData();
        }
    }

    function saveLocalData() {
        localStorage.setItem('veg_todayClicks', todayClicks);
        localStorage.setItem('veg_lastDate', lastDate);
        localStorage.setItem('veg_currentTreeClicks', currentTreeClicks);
        localStorage.setItem('veg_treesCollected', totalTreesCollected);
        localStorage.setItem('veg_treeSeed', treeSeed);
    }

    function syncToGoogleSheet() {
        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = '☁️ 正在同步進度至雲端...';

        const payload = {
            nickname: nickname,
            pin: pin,
            todayClicks: todayClicks,
            currentTreeClicks: currentTreeClicks,
            totalTreesCollected: totalTreesCollected,
            treeSeed: treeSeed
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                statusEl.textContent = '✅ 已成功同步至 Google 試算表';
            } else {
                statusEl.textContent = '⚠️ 雲端同步回應異常';
            }
            setTimeout(() => { statusEl.textContent = ''; }, 3000);
        })
        .catch(() => {
            statusEl.textContent = '⚠️ 網路連線問題，資料已先存於本機';
            setTimeout(() => { statusEl.textContent = ''; }, 3000);
        });
    }

    function loadCloudDataPrompt() {
        const inputNk = prompt('請輸入您的「暱稱」：', nickname);
        const inputPin = prompt('請輸入您的「手機後 3 碼」：', pin);

        if (!inputNk || !inputPin) return;

        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = '🔍 正在搜尋雲端資料...';

        fetch(`${GOOGLE_SCRIPT_URL}?nickname=${encodeURIComponent(inputNk)}&pin=${encodeURIComponent(inputPin)}`)
        .then(res => res.json())
        .then(res => {
            if (res.status === 'success') {
                const data = res.data;
                nickname = data.nickname;
                pin = data.pin;
                todayClicks = Number(data.todayClicks);
                currentTreeClicks = Number(data.currentTreeClicks);
                totalTreesCollected = Number(data.totalTreesCollected);
                treeSeed = Number(data.treeSeed);

                localStorage.setItem('veg_nickname', nickname);
                localStorage.setItem('veg_pin', pin);
                saveLocalData();

                targetGrowth = currentTreeClicks;
                currentGrowth = currentTreeClicks;

                checkUserCredentials();
                updateUI();
                render();
                alert(`🎉 歡迎回來 ${nickname}！成功復原小樹與圖鑑進度！`);
            } else {
                alert('❌ 找不到對應的記錄，請檢查「暱稱」與「手機後 3 碼」是否正確。');
            }
            statusEl.textContent = '';
        })
        .catch(() => {
            alert('⚠️ 讀取失敗，請確認網路連線與 Google 腳本網址。');
            statusEl.textContent = '';
        });
    }

    function drawTree(startX, startY, len, angle, branchWidth, depth, growthProgress) {
        if (depth === 0 || len <= 2) return;

        ctx.beginPath();
        ctx.save();
        ctx.strokeStyle = depth > 2 ? '#4e342e' : '#3e2723';
        ctx.lineWidth = branchWidth;
        ctx.lineCap = 'round';

        ctx.translate(startX, startY);
        ctx.rotate(angle * Math.PI / 180);

        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len);
        ctx.stroke();

        if (depth <= 3 && growthProgress > 2) {
            const leafSize = Math.min(9, (growthProgress / MAX_TREE_CLICKS) * 11);
            ctx.beginPath();
            ctx.fillStyle = depth === 1 ? '#4caf50' : '#2e7d32';
            ctx.arc(0, -len, leafSize, 0, Math.PI * 2);
            ctx.fill();
        }

        const spreadAngleLeft = 15 + seededRandom() * 20;
        const spreadAngleRight = 15 + seededRandom() * 20;
        const childLenLeft = len * (0.65 + seededRandom() * 0.15);
        const childLenRight = len * (0.65 + seededRandom() * 0.15);

        if (depth > 1) {
            drawTree(0, -len, childLenLeft, spreadAngleLeft, branchWidth * 0.7, depth - 1, growthProgress);
            drawTree(0, -len, childLenRight, -spreadAngleRight, branchWidth * 0.7, depth - 1, growthProgress);
        }

        ctx.restore();
    }

    function render() {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        currentPRNGState = treeSeed;

        if (currentGrowth < 1) {
            ctx.fillStyle = '#795548';
            ctx.beginPath();
            ctx.ellipse(200, 305, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (currentGrowth < 3) {
            const sproutHeight = currentGrowth * 12;
            ctx.beginPath();
            ctx.strokeStyle = '#8bc34a';
            ctx.lineWidth = 4;
            ctx.moveTo(200, 310);
            ctx.lineTo(200, 310 - sproutHeight);
            ctx.stroke();

            ctx.fillStyle = '#8bc34a';
            ctx.beginPath();
            ctx.arc(194, 310 - sproutHeight, 5, 0, Math.PI * 2);
            ctx.arc(206, 310 - sproutHeight, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const maxDepth = Math.min(10, Math.floor(3 + currentGrowth / 1.8));
            const trunkLength = Math.min(78, 22 + currentGrowth * 4.0);
            const trunkWidth = Math.min(14, 2 + currentGrowth * 0.8);

            drawTree(200, 310, trunkLength, 0, trunkWidth, maxDepth, currentGrowth);
        }

        if (particles.length > 0) {
            particles.forEach(p => {
                ctx.font = `${p.size}px sans-serif`;
                ctx.fillText(p.char, p.x, p.y);
            });
        }
    }

    function animate() {
        isAnimating = true;
        let isGrowing = Math.abs(targetGrowth - currentGrowth) > 0.01;
        let hasParticles = particles.length > 0;

        if (isGrowing) {
            currentGrowth += (targetGrowth - currentGrowth) * 0.08;
        } else {
            currentGrowth = targetGrowth;
        }

        if (hasParticles) {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].y += particles[i].vy;
                particles[i].x += particles[i].vx;
                particles[i].opacity -= 0.015;
                if (particles[i].y > 310 || particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        render();

        if (isGrowing || hasParticles) {
            requestAnimationFrame(animate);
        } else {
            isAnimating = false;
        }
    }

    function triggerVeggieAnimation() {
        const chars = ['🥬', '🥦', '🥗', '🍃', '✨'];
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: 120 + Math.random() * 160,
                y: -10 - Math.random() * 100,
                vx: (Math.random() - 0.5) * 1.5,
                vy: 2.5 + Math.random() * 2.5,
                size: 14 + Math.random() * 10,
                char: chars[Math.floor(Math.random() * chars.length)],
                opacity: 1
            });
        }
        if (!isAnimating) animate();
    }

    function updateUI() {
        checkDailyReset();

        document.getElementById('todayVeg').textContent = `${todayClicks} / ${MAX_DAILY_CLICKS} 次`;
        document.getElementById('progress').textContent = `${currentTreeClicks} / ${MAX_TREE_CLICKS}`;
        document.getElementById('treeCount').textContent = `${totalTreesCollected} 棵`;

        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');

        if (currentTreeClicks >= MAX_TREE_CLICKS) {
            actionBtn.disabled = false;
            actionBtn.classList.add('btn-harvest');
            actionBtn.textContent = '🎉 大樹完熟！點擊收穫並種植新樹';
            messageEl.textContent = '🌟 太棒了！這棵小樹因您的蔬食行動長成大樹囉！';
        } else if (todayClicks >= MAX_DAILY_CLICKS) {
            actionBtn.disabled = true;
            actionBtn.classList.remove('btn-harvest');
            actionBtn.textContent = '🥗 今天蔬食次數已達上限';
            messageEl.textContent = '👏 今天已完成 3 次蔬食紀錄！小樹正在茁壯，明天繼續加油！';
        } else {
            actionBtn.disabled = false;
            actionBtn.classList.remove('btn-harvest');
            const remaining = MAX_DAILY_CLICKS - todayClicks;
            actionBtn.textContent = `🥗 我今天吃蔬食 (剩 ${remaining} 次)`;
            messageEl.textContent = `🌱 每吃一餐蔬食點一次，幫助小樹成長 (每天限 ${MAX_DAILY_CLICKS} 次)`;
        }

        renderGallery();
    }

    function renderGallery() {
        const grid = document.getElementById('animalsGrid');
        grid.innerHTML = '';
        let unlockedCount = 0;

        ANIMAL_LIST.forEach(animal => {
            const isUnlocked = totalTreesCollected >= animal.requiredTrees;
            if (isUnlocked) unlockedCount++;

            const card = document.createElement('div');
            card.className = `animal-card ${isUnlocked ? 'unlocked' : ''}`;
            card.innerHTML = `
                <span class="animal-icon">${animal.icon}</span>
                <div>${animal.name}</div>
                <div style="font-size:9px; margin-top:2px; color:${isUnlocked ? '#43a047' : '#9e9e9e'};">
                    ${isUnlocked ? '已解鎖' : `${animal.requiredTrees} 棵樹`}
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('animalProgress').textContent = `(${unlockedCount}/${ANIMAL_LIST.length} 解鎖)`;
    }

    function handleAction() {
        checkDailyReset();

        if (currentTreeClicks >= MAX_TREE_CLICKS) {
            totalTreesCollected++;
            currentTreeClicks = 0;
            targetGrowth = 0;
            currentGrowth = 0;
            treeSeed = Math.floor(Math.random() * 100000);

            saveLocalData();
            syncToGoogleSheet();
            updateUI();
            if (!isAnimating) animate();

            alert('🌳 恭喜收穫 1 棵成熟大樹！已寫入雲端圖鑑，並準備好種植下一顆新種子囉！');
            return;
        }

        if (todayClicks < MAX_DAILY_CLICKS && currentTreeClicks < MAX_TREE_CLICKS) {
            todayClicks++;
            currentTreeClicks++;
            targetGrowth = currentTreeClicks;

            saveLocalData();
            syncToGoogleSheet();
            updateUI();
            triggerVeggieAnimation();
        }
    }

    // 初始化流程
    checkUserCredentials();
    checkDailyReset();
    updateUI();
    render();
</script>

</body>
</html>
