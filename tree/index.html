<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔬食小樹日記 - 多元森林繪本版</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f0f7f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .app-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(46, 90, 53, 0.1);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            text-align: center;
        }
        .header {
            padding: 18px 20px 12px;
            background: #e8f5e9;
            border-bottom: 1px solid #c8e6c9;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #2e7d32;
        }
        .user-bar {
            margin-top: 8px;
            font-size: 12px;
            color: #4a7050;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.6);
            padding: 6px 12px;
            border-radius: 12px;
        }
        .sync-btn {
            color: #2e7d32;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            color: #388e3c;
            font-size: 13px;
        }
        .stat-box strong {
            display: block;
            font-size: 18px;
            color: #1b5e20;
            margin-top: 2px;
        }
        .canvas-container {
            position: relative;
            background: linear-gradient(to bottom, #e3f2fd 0%, #ffffff 75%, #d7ccc8 75%, #a1887f 100%);
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        canvas { display: block; }
        .controls { padding: 20px; }
        .btn-action {
            background: linear-gradient(135deg, #66bb6a, #43a047);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(67, 160, 71, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 320px;
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 160, 71, 0.4);
        }
        .btn-action:disabled {
            background: #bdbdbd;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-harvest {
            background: linear-gradient(135deg, #ffa726, #fb8c00) !important;
            box-shadow: 0 4px 12px rgba(251, 140, 0, 0.3) !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .message {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            min-height: 18px;
        }
        .gallery-section {
            border-top: 1px dashed #e0e0e0;
            padding: 15px 20px 20px;
            background: #fafafa;
        }
        .gallery-title {
            font-size: 14px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .animals-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .animal-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 8px 4px;
            font-size: 11px;
            color: #757575;
        }
        .animal-card.unlocked {
            border-color: #81c784;
            background: #f1f8e9;
            color: #2e7d32;
            font-weight: bold;
        }
        .animal-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
            filter: grayscale(100%);
            opacity: 0.3;
        }
        .animal-card.unlocked .animal-icon {
            filter: grayscale(0%);
            opacity: 1;
        }
        .sync-status {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>🥗 蔬食養成日記</h1>
        <div class="user-bar">
            <span>👤 玩家：<strong id="displayNickname">尚未設定</strong></span>
            <span class="sync-btn" onclick="loadCloudDataPrompt()">☁️ 讀取舊雲端進度</span>
        </div>
        <div class="stats">
            <div class="stat-box">今日蔬食<strong id="todayVeg">0 / 3 次</strong></div>
            <div class="stat-box">小樹進度<strong id="progress">0 / 15</strong></div>
            <div class="stat-box">累積大樹<strong id="treeCount">0 棵</strong></div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="treeCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="actionBtn" class="btn-action" onclick="handleAction()">🥗 我今天吃蔬食</button>
        <div id="message" class="message"></div>
        <div id="syncStatus" class="sync-status"></div>
    </div>

    <div class="gallery-section">
        <div class="gallery-title">
            <span>🐾 森林動物圖鑑</span>
            <span id="animalProgress" style="font-size:12px; font-weight:normal; color:#666;">(0/4 解鎖)</span>
        </div>
        <div class="animals-grid" id="animalsGrid"></div>
    </div>
</div>

<script>
    // 🔗 請確認以下替換為您專屬的 API 網址：
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRilBMphU9Ck8ScCDmlMUwM7eN0BgzcEloteFi8YoO7TSlosgZNDIQRxQObPqBVToz/exec";

    const MAX_DAILY_CLICKS = 3;
    const MAX_TREE_CLICKS = 15;

    const ANIMAL_LIST = [
        { name: "萌萌兔", icon: "🐰", requiredTrees: 3 },
        { name: "靈巧松鼠", icon: "🐿️", requiredTrees: 6 },
        { name: "溫和梅花鹿", icon: "🦌", requiredTrees: 9 },
        { name: "溫馨刺蝟", icon: "🦔", requiredTrees: 12 }
    ];

    const TREE_NAMES = ["🌳 經典寫實樹", "🌲 鋸齒冷杉樹", "☁️ 蓬鬆雲朵樹", "🔺 三角幾何樹", "🟢 圓球葉脈樹"];

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const logicalWidth = 400;
    const logicalHeight = 350;
    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = '100%';
    canvas.style.maxWidth = `${logicalWidth}px`;
    canvas.style.height = `${logicalHeight}px`;
    canvas.width = logicalWidth * dpr;
    canvas.height = logicalHeight * dpr;
    ctx.scale(dpr, dpr);

    let nickname = localStorage.getItem('veg_nickname') || '';
    let pin = localStorage.getItem('veg_pin') || '';
    let seminarClass = localStorage.getItem('veg_seminarClass') || '';
    let todayClicks = parseInt(localStorage.getItem('veg_todayClicks')) || 0;
    let lastDate = localStorage.getItem('veg_lastDate') || '';
    let currentTreeClicks = parseInt(localStorage.getItem('veg_currentTreeClicks')) || 0;
    let totalTreesCollected = parseInt(localStorage.getItem('veg_treesCollected')) || 0;
    let treeSeed = parseInt(localStorage.getItem('veg_treeSeed')) || Math.floor(Math.random() * 100000);

    let currentGrowth = currentTreeClicks;
    let targetGrowth = currentTreeClicks;
    let isAnimating = false;
    let particles = [];
    let currentPRNGState = treeSeed;

    function seededRandom() {
        currentPRNGState = (currentPRNGState * 9301 + 49297) % 233280;
        return currentPRNGState / 233280;
    }

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    }

    function checkUserCredentials() {
        if (!nickname || !pin || !seminarClass) {
            nickname = prompt('歡迎來到蔬食日記！請輸入您的「暱稱」：') || `蔬食愛好者${Math.floor(Math.random()*1000)}`;
            pin = prompt('請輸入您的「手機後 3 碼」（用於換手機時撈回進度）：') || '000';
            seminarClass = prompt('請輸入您的「研討班資料」（例如：南14廣001）：') || '未填寫';
            
            localStorage.setItem('veg_nickname', nickname);
            localStorage.setItem('veg_pin', pin);
            localStorage.setItem('veg_seminarClass', seminarClass);
        }
        document.getElementById('displayNickname').textContent = `${nickname} (${seminarClass})`;
    }

    function checkDailyReset() {
        const today = getTodayString();
        if (lastDate !== today) {
            todayClicks = 0;
            lastDate = today;
            saveLocalData();
        }
    }

    function saveLocalData() {
        localStorage.setItem('veg_todayClicks', todayClicks);
        localStorage.setItem('veg_lastDate', lastDate);
        localStorage.setItem('veg_currentTreeClicks', currentTreeClicks);
        localStorage.setItem('veg_treesCollected', totalTreesCollected);
        localStorage.setItem('veg_treeSeed', treeSeed);
        localStorage.setItem('veg_seminarClass', seminarClass);
    }

    function syncToGoogleSheet() {
        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = '☁️ 正在同步進度至雲端...';

        const payload = {
            nickname: nickname,
            pin: pin,
            seminarClass: seminarClass,
            todayClicks: todayClicks,
            currentTreeClicks: currentTreeClicks,
            totalTreesCollected: totalTreesCollected,
            treeSeed: treeSeed
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                statusEl.textContent = '✅ 已成功同步至 Google 試算表';
            } else {
                statusEl.textContent = '⚠️ 雲端同步回應異常';
            }
            setTimeout(() => { statusEl.textContent = ''; }, 3000);
        })
        .catch(() => {
            statusEl.textContent = '⚠️ 網路連線問題，資料已先存於本機';
            setTimeout(() => { statusEl.textContent = ''; }, 3000);
        });
    }

    function loadCloudDataPrompt() {
        const inputNk = prompt('請輸入您的「暱稱」：', nickname);
        const inputPin = prompt('請輸入您的「手機後 3 碼」：', pin);

        if (!inputNk || !inputPin) return;

        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = '🔍 正在搜尋雲端資料...';

        fetch(`${GOOGLE_SCRIPT_URL}?nickname=${encodeURIComponent(inputNk)}&pin=${encodeURIComponent(inputPin)}`)
        .then(res => res.json())
        .then(res => {
            if (res.status === 'success') {
                const data = res.data;
                nickname = data.nickname;
                pin = data.pin;
                seminarClass = data.seminarClass || '未填寫';
                todayClicks = Number(data.todayClicks);
                currentTreeClicks = Number(data.currentTreeClicks);
                totalTreesCollected = Number(data.totalTreesCollected);
                treeSeed = Number(data.treeSeed);

                localStorage.setItem('veg_nickname', nickname);
                localStorage.setItem('veg_pin', pin);
                localStorage.setItem('veg_seminarClass', seminarClass);
                saveLocalData();

                targetGrowth = currentTreeClicks;
                currentGrowth = currentTreeClicks;

                checkUserCredentials();
                updateUI();
                render();
                alert(`🎉 歡迎回來 ${nickname} (${seminarClass})！成功復原小樹與圖鑑進度！`);
            } else {
                alert('❌ 找不到對應的記錄，請檢查「暱稱」與「手機後 3 碼」是否正確。');
            }
            statusEl.textContent = '';
        })
        .catch(() => {
            alert('⚠️ 讀取失敗，請確認網路連線與 Google 腳本網址。');
            statusEl.textContent = '';
        });
    }

    // ----------------------------------------------------
    // 🎨 五大多元繪本風格大樹演算法
    // ----------------------------------------------------

    // 1. 經典寫實分枝樹
    function drawClassicFoliage(x, y, radius) {
        if (radius <= 1) return;
        const colors = ['rgba(27, 94, 32, 0.85)', 'rgba(46, 125, 50, 0.85)', 'rgba(76, 175, 80, 0.80)', 'rgba(129, 199, 132, 0.75)'];
        ctx.save();
        ctx.translate(x, y);
        for (let i = 0; i < 6; i++) {
            const angle = seededRandom() * Math.PI * 2;
            const dist = seededRandom() * radius * 0.6;
            ctx.beginPath();
            ctx.fillStyle = colors[Math.floor(seededRandom() * colors.length)];
            ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawClassicTree(startX, startY, len, angle, branchWidth, depth, growth) {
        if (depth === 0 || len <= 2) return;
        ctx.save();
        ctx.translate(startX, startY);
        ctx.rotate(angle * Math.PI / 180);
        ctx.beginPath();
        ctx.strokeStyle = depth > 3 ? '#3e2723' : '#4e342e';
        ctx.lineWidth = branchWidth;
        ctx.lineCap = 'round';
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo((seededRandom() - 0.5) * len * 0.3, -len * 0.5, 0, -len);
        ctx.stroke();

        if (depth <= 4 && growth > 2) {
            drawClassicFoliage(0, -len, Math.min(22, 6 + (growth / MAX_TREE_CLICKS) * 20) * (depth / 4));
        }
        if (depth > 1) {
            drawClassicTree(0, -len, len * 0.7, 20 + seededRandom() * 15, branchWidth * 0.7, depth - 1, growth);
            drawClassicTree(0, -len, len * 0.7, -20 - seededRandom() * 15, branchWidth * 0.7, depth - 1, growth);
        }
        ctx.restore();
    }

    // 2. 🌲 鋸齒冷杉/松樹
    function drawPineTree(x, y, growth) {
        const height = Math.min(180, 40 + growth * 9.5);
        const width = Math.min(130, 20 + growth * 7.5);

        // 樹幹
        ctx.fillStyle = '#4e342e';
        ctx.beginPath();
        ctx.rect(x - 8, y - height * 0.25, 16, height * 0.25);
        ctx.fill();

        // 3-5 層鋸齒鋸形樹冠
        const layers = Math.min(5, Math.floor(2 + growth / 3));
        const layerHeight = (height * 0.85) / layers;

        for (let i = 0; i < layers; i++) {
            const layerY = y - height * 0.2 - (i * layerHeight * 0.75);
            const layerW = width * (1 - i * 0.18);
            
            ctx.fillStyle = i % 2 === 0 ? '#2e7d32' : '#388e3c';
            ctx.beginPath();
            ctx.moveTo(x, layerY - layerHeight);
            ctx.lineTo(x - layerW / 2, layerY);
            ctx.lineTo(x - layerW / 4, layerY - layerHeight * 0.2);
            ctx.lineTo(x - layerW * 0.6, layerY + layerHeight * 0.2);
            ctx.lineTo(x + layerW * 0.6, layerY + layerHeight * 0.2);
            ctx.lineTo(x + layerW / 4, layerY - layerHeight * 0.2);
            ctx.lineTo(x + layerW / 2, layerY);
            ctx.closePath();
            ctx.fill();
        }
    }

    // 3. ☁️ 蓬鬆雲朵花樹
    function drawCloudTree(x, y, growth) {
        const treeH = Math.min(170, 40 + growth * 9);
        const radius = Math.min(75, 15 + growth * 4);

        // 主樹幹
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = Math.min(14, 3 + growth * 0.7);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x - 10, y - treeH * 0.5, x, y - treeH * 0.6);
        ctx.stroke();

        if (growth <= 2) return;

        // 雲朵圓弧聚合物
        const cloudY = y - treeH * 0.65;
        const bumps = [
            { dx: 0, dy: -radius * 0.4, r: radius * 0.6, c: '#81c784' },
            { dx: -radius * 0.45, dy: -radius * 0.1, r: radius * 0.5, c: '#4caf50' },
            { dx: radius * 0.45, dy: -radius * 0.1, r: radius * 0.5, c: '#43a047' },
            { dx: -radius * 0.25, dy: radius * 0.25, r: radius * 0.45, c: '#388e3c' },
            { dx: radius * 0.25, dy: radius * 0.25, r: radius * 0.45, c: '#2e7d32' }
        ];

        bumps.forEach(b => {
            ctx.fillStyle = b.c;
            ctx.beginPath();
            ctx.arc(x + b.dx, cloudY + b.dy, b.r, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // 4. 🔺 三角幾何傘樹
    function drawTriangleTree(x, y, growth) {
        const treeH = Math.min(175, 45 + growth * 9);
        const triW = Math.min(140, 30 + growth * 7.5);

        // Y 型樹幹
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = Math.min(12, 3 + growth * 0.6);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - treeH * 0.45);
        ctx.lineTo(x - triW * 0.25, y - treeH * 0.7);
        ctx.moveTo(x, y - treeH * 0.45);
        ctx.lineTo(x + triW * 0.25, y - treeH * 0.7);
        ctx.stroke();

        if (growth <= 2) return;

        // 正三角幾何樹冠
        const topY = y - treeH;
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath();
        ctx.moveTo(x, topY);
        ctx.lineTo(x - triW / 2, y - treeH * 0.35);
        ctx.quadraticCurveTo(x, y - treeH * 0.28, x + triW / 2, y - treeH * 0.35);
        ctx.closePath();
        ctx.fill();

        // 亮色裝飾內層
        ctx.fillStyle = '#66bb6a';
        ctx.beginPath();
        ctx.moveTo(x, topY + treeH * 0.1);
        ctx.lineTo(x - triW * 0.35, y - treeH * 0.38);
        ctx.lineTo(x + triW * 0.35, y - treeH * 0.38);
        ctx.closePath();
        ctx.fill();
    }

    // 5. 🟢 圓球葉脈樹
    function drawSphereTree(x, y, growth) {
        const treeH = Math.min(180, 45 + growth * 9);
        const sphereR = Math.min(65, 12 + growth * 3.8);
        const centerY = y - treeH + sphereR;

        // 直樹幹與魚骨斜枝
        ctx.strokeStyle = '#6d4c41';
        ctx.lineWidth = Math.min(10, 3 + growth * 0.5);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - treeH * 0.95);
        ctx.stroke();

        if (growth > 2) {
            // 斜向分支
            ctx.lineWidth = 3;
            for (let i = 1; i <= 3; i++) {
                const branchY = y - treeH * 0.3 - (i * sphereR * 0.35);
                ctx.beginPath();
                ctx.moveTo(x, branchY);
                ctx.lineTo(x - sphereR * 0.5, branchY - sphereR * 0.25);
                ctx.moveTo(x, branchY);
                ctx.lineTo(x + sphereR * 0.5, branchY - sphereR * 0.25);
                ctx.stroke();
            }

            // 外圍圓形樹冠
            ctx.fillStyle = 'rgba(76, 175, 80, 0.75)';
            ctx.beginPath();
            ctx.arc(x, centerY, sphereR, 0, Math.PI * 2);
            ctx.fill();

            // 樹葉飾點
            ctx.fillStyle = '#1b5e20';
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                const lx = x + Math.cos(angle) * sphereR * 0.65;
                const ly = centerY + Math.sin(angle) * sphereR * 0.65;
                ctx.beginPath();
                ctx.arc(lx, ly, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // 主繪製派發器
    function renderTreeScene(growth) {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        currentPRNGState = treeSeed;

        // 地面陰影
        const shadowR = Math.min(50, 10 + growth * 2.8);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        ctx.beginPath();
        ctx.ellipse(200, 318, shadowR, shadowR * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();

        if (growth < 1) {
            // 種子階段
            ctx.fillStyle = '#6d4c41';
            ctx.beginPath();
            ctx.ellipse(200, 315, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 依據 treeSeed % 5 繪製 5 種不同手繪風格大樹
            const treeType = treeSeed % 5;
            switch(treeType) {
                case 0:
                    drawClassicTree(200, 318, Math.min(85, 25 + growth * 4.2), 0, Math.min(16, 3 + growth * 0.85), Math.min(10, Math.floor(3 + growth / 1.7)), growth);
                    break;
                case 1:
                    drawPineTree(200, 318, growth);
                    break;
                case 2:
                    drawCloudTree(200, 318, growth);
                    break;
                case 3:
                    drawTriangleTree(200, 318, growth);
                    break;
                case 4:
                    drawSphereTree(200, 318, growth);
                    break;
            }
        }

        // 飄落蔬食粒子
        if (particles.length > 0) {
            particles.forEach(p => {
                ctx.font = `${p.size}px sans-serif`;
                ctx.fillText(p.char, p.x, p.y);
            });
        }
    }

    function animate() {
        isAnimating = true;
        let isGrowing = Math.abs(targetGrowth - currentGrowth) > 0.01;
        let hasParticles = particles.length > 0;

        if (isGrowing) {
            currentGrowth += (targetGrowth - currentGrowth) * 0.08;
        } else {
            currentGrowth = targetGrowth;
        }

        if (hasParticles) {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].y += particles[i].vy;
                particles[i].x += particles[i].vx;
                particles[i].opacity -= 0.015;
                if (particles[i].y > 320 || particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        renderTreeScene(currentGrowth);

        if (isGrowing || hasParticles) {
            requestAnimationFrame(animate);
        } else {
            isAnimating = false;
        }
    }

    function triggerVeggieAnimation() {
        const chars = ['🥬', '🥦', '🥗', '🍃', '✨'];
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: 120 + Math.random() * 160,
                y: -10 - Math.random() * 100,
                vx: (Math.random() - 0.5) * 1.5,
                vy: 2.5 + Math.random() * 2.5,
                size: 14 + Math.random() * 10,
                char: chars[Math.floor(Math.random() * chars.length)],
                opacity: 1
            });
        }
        if (!isAnimating) animate();
    }

    function updateUI() {
        checkDailyReset();

        document.getElementById('todayVeg').textContent = `${todayClicks} / ${MAX_DAILY_CLICKS} 次`;
        document.getElementById('progress').textContent = `${currentTreeClicks} / ${MAX_TREE_CLICKS}`;
        document.getElementById('treeCount').textContent = `${totalTreesCollected} 棵`;

        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');

        const currentTreeType = TREE_NAMES[treeSeed % 5];

        if (currentTreeClicks >= MAX_TREE_CLICKS) {
            actionBtn.disabled = false;
            actionBtn.classList.add('btn-harvest');
            actionBtn.textContent = '🎉 大樹完熟！點擊收穫並種植新樹';
            messageEl.textContent = `🌟 太棒了！您的蔬食行動養成了完熟的【${currentTreeType}】囉！`;
        } else if (todayClicks >= MAX_DAILY_CLICKS) {
            actionBtn.disabled = true;
            actionBtn.classList.remove('btn-harvest');
            actionBtn.textContent = '🥗 今天蔬食次數已達上限';
            messageEl.textContent = `👏 今天已完成 3 次蔬食紀錄！【${currentTreeType}】正在茁壯，明天繼續加油！`;
        } else {
            actionBtn.disabled = false;
            actionBtn.classList.remove('btn-harvest');
            const remaining = MAX_DAILY_CLICKS - todayClicks;
            actionBtn.textContent = `🥗 我今天吃蔬食 (剩 ${remaining} 次)`;
            messageEl.textContent = `🌱 每吃一餐蔬食點一次，照顧【${currentTreeType}】(每天限 ${MAX_DAILY_CLICKS} 次)`;
        }

        renderGallery();
    }

    function renderGallery() {
        const grid = document.getElementById('animalsGrid');
        grid.innerHTML = '';
        let unlockedCount = 0;

        ANIMAL_LIST.forEach(animal => {
            const isUnlocked = totalTreesCollected >= animal.requiredTrees;
            if (isUnlocked) unlockedCount++;

            const card = document.createElement('div');
            card.className = `animal-card ${isUnlocked ? 'unlocked' : ''}`;
            card.innerHTML = `
                <span class="animal-icon">${animal.icon}</span>
                <div>${animal.name}</div>
                <div style="font-size:9px; margin-top:2px; color:${isUnlocked ? '#43a047' : '#9e9e9e'};">
                    ${isUnlocked ? '已解鎖' : `${animal.requiredTrees} 棵樹`}
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('animalProgress').textContent = `(${unlockedCount}/${ANIMAL_LIST.length} 解鎖)`;
    }

    function handleAction() {
        checkDailyReset();

        if (currentTreeClicks >= MAX_TREE_CLICKS) {
            totalTreesCollected++;
            currentTreeClicks = 0;
            targetGrowth = 0;
            currentGrowth = 0;
            treeSeed = Math.floor(Math.random() * 100000);

            saveLocalData();
            syncToGoogleSheet();
            updateUI();
            if (!isAnimating) animate();

            alert('🌳 恭喜收穫 1 棵成熟大樹！已寫入雲端圖鑑，並隨機抽取種植下一顆新樹種囉！');
            return;
        }

        if (todayClicks < MAX_DAILY_CLICKS && currentTreeClicks < MAX_TREE_CLICKS) {
            todayClicks++;
            currentTreeClicks++;
            targetGrowth = currentTreeClicks;

            saveLocalData();
            syncToGoogleSheet();
            updateUI();
            triggerVeggieAnimation();
        }
    }

    // 初始化流程
    checkUserCredentials();
    checkDailyReset();
    updateUI();
    renderTreeScene(currentGrowth);
</script>

</body>
</html>
