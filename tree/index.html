<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小樹養成日記 - 動態成長版</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f3f8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .app-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
        }
        .header {
            padding: 20px;
            background: #e7f3e8;
            border-bottom: 1px solid #d2e7d4;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #2e5a35;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            color: #4a7050;
            font-size: 14px;
        }
        .stat-box strong {
            display: block;
            font-size: 20px;
            color: #2e5a35;
        }
        /* Canvas 畫布區 */
        .canvas-container {
            position: relative;
            background: linear-gradient(to bottom, #eaf6ff 0%, #ffffff 80%, #e5d3b3 80%, #c4a77d 100%);
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        canvas {
            display: block;
        }
        .controls {
            padding: 25px 20px;
        }
        .btn-water {
            background: linear-gradient(135deg, #42a5f5, #1e88e5);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
            transition: all 0.2s ease;
        }
        .btn-water:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(30, 136, 229, 0.4);
        }
        .btn-water:disabled {
            background: #bdbdbd;
            box-shadow: none;
            cursor: not-allowed;
        }
        .message {
            margin-top: 12px;
            font-size: 13px;
            color: #757575;
            min-height: 18px;
        }
        .reset-link {
            display: inline-block;
            margin-top: 15px;
            color: #a0a0a0;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>🌱 小樹養成日記</h1>
        <div class="stats">
            <div class="stat-box">累積天數<strong id="days">0</strong></div>
            <div class="stat-box">成長進度<strong id="progress">0%</strong></div>
        </div>
    </div>

    <div class="canvas-container">
        <!-- 移除寫死的寬高，改由 JS 動態設定支援 Retina -->
        <canvas id="treeCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="waterBtn" class="btn-water" onclick="waterTree()">💧 澆水照顧</button>
        <div id="message" class="message"></div>
        <span class="reset-link" onclick="resetTree()">重新種植新種子</span>
    </div>
</div>

<script>
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    // 🌟 優化 1：Retina 高解析度螢幕適配
    const logicalWidth = 400;
    const logicalHeight = 380;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = '100%'; // 讓 CSS 彈性控制
    canvas.style.maxWidth = `${logicalWidth}px`;
    canvas.style.height = `${logicalHeight}px`;
    canvas.width = logicalWidth * dpr;
    canvas.height = logicalHeight * dpr;
    ctx.scale(dpr, dpr); // 將座標系縮放，繪圖程式碼只需照原本的 (0~400) 邏輯寫即可

    // 養成狀態變數
    let waterCount = parseInt(localStorage.getItem('canvasTree_days')) || 0;
    let lastWateredDate = localStorage.getItem('canvasTree_lastDate') || '';
    
    // 🌟 優化 2：專屬樹木基因（每次重置都長得不一樣）
    let treeSeed = parseInt(localStorage.getItem('canvasTree_seed'));
    if (!treeSeed) {
        treeSeed = Math.floor(Math.random() * 100000);
        localStorage.setItem('canvasTree_seed', treeSeed);
    }
    
    // 簡易隨機數生成器 (PRNG)，確保同一顆種子每次畫出來的樹枝角度都一樣
    let currentPRNGState = treeSeed;
    function seededRandom() {
        currentPRNGState = (currentPRNGState * 9301 + 49297) % 233280;
        return currentPRNGState / 233280;
    }

    // 動畫控制
    let currentGrowth = waterCount; 
    let targetGrowth = waterCount;
    let isAnimating = false;
    const MAX_DAYS = 30;

    // 🌟 優化 3：水滴粒子系統
    let particles = [];

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    }

    // Canvas 繪圖與動態樹演算法
    function drawTree(startX, startY, len, angle, branchWidth, depth, growthProgress) {
        if (depth === 0 || len <= 2) return;

        ctx.beginPath();
        ctx.save();
        ctx.strokeStyle = depth > 2 ? '#5c4033' : '#3e2723';
        ctx.lineWidth = branchWidth;
        ctx.lineCap = 'round';

        ctx.translate(startX, startY);
        ctx.rotate(angle * Math.PI / 180);

        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len);
        ctx.stroke();

        // 繪製樹葉
        if (depth <= 3 && growthProgress > 3) {
            const leafSize = Math.min(8, (growthProgress / MAX_DAYS) * 10);
            ctx.beginPath();
            ctx.fillStyle = depth === 1 ? '#4caf50' : '#2e7d32';
            ctx.arc(0, -len, leafSize, 0, Math.PI * 2);
            ctx.fill();
        }

        // 透過 PRNG 產生樹枝發散角度與長度（賦予生命力）
        const spreadAngleLeft = 15 + seededRandom() * 20;  // 15~35度
        const spreadAngleRight = 15 + seededRandom() * 20; // 15~35度
        const childLenLeft = len * (0.65 + seededRandom() * 0.15); // 長度比例隨機
        const childLenRight = len * (0.65 + seededRandom() * 0.15);

        if (depth > 1) {
            drawTree(0, -len, childLenLeft, spreadAngleLeft, branchWidth * 0.7, depth - 1, growthProgress);
            drawTree(0, -len, childLenRight, -spreadAngleRight, branchWidth * 0.7, depth - 1, growthProgress);
        }

        ctx.restore();
    }

    // 渲染整個場景 (包含樹與水滴)
    function render() {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        
        // 每次渲染前重置種子，保證畫面穩定不閃爍
        currentPRNGState = treeSeed;

        if (currentGrowth < 1) {
            // 種子
            ctx.fillStyle = '#795548';
            ctx.beginPath();
            ctx.ellipse(200, 345, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (currentGrowth < 3) {
            // 剛發芽
            const sproutHeight = currentGrowth * 15;
            ctx.beginPath();
            ctx.strokeStyle = '#8bc34a';
            ctx.lineWidth = 4;
            ctx.moveTo(200, 350);
            ctx.lineTo(200, 350 - sproutHeight);
            ctx.stroke();

            ctx.fillStyle = '#8bc34a';
            ctx.beginPath();
            ctx.arc(195, 350 - sproutHeight, 5, 0, Math.PI * 2);
            ctx.arc(205, 350 - sproutHeight, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 大樹
            const maxDepth = Math.min(10, Math.floor(3 + currentGrowth / 4));
            const trunkLength = Math.min(80, 20 + currentGrowth * 2.5);
            const trunkWidth = Math.min(14, 2 + currentGrowth * 0.4);

            drawTree(200, 350, trunkLength, 0, trunkWidth, maxDepth, currentGrowth);
        }

        // 繪製水滴粒子
        if (particles.length > 0) {
            ctx.fillStyle = 'rgba(66, 165, 245, 0.7)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    }

    // 主動畫迴圈：整合成長過渡與水滴掉落
    function animate() {
        isAnimating = true;
        let isGrowing = Math.abs(targetGrowth - currentGrowth) > 0.01;
        let hasParticles = particles.length > 0;

        // 樹木成長平滑邏輯
        if (isGrowing) {
            currentGrowth += (targetGrowth - currentGrowth) * 0.05;
        } else {
            currentGrowth = targetGrowth;
        }

        // 水滴掉落邏輯
        if (hasParticles) {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].y += particles[i].vy;
                if (particles[i].y > 350) {
                    particles.splice(i, 1); // 落地後消失
                }
            }
        }

        render();

        // 只有在需要更新時才繼續呼叫 requestAnimationFrame，節省效能
        if (isGrowing || hasParticles) {
            requestAnimationFrame(animate);
        } else {
            isAnimating = false;
        }
    }

    function createWaterAnimation() {
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: 100 + Math.random() * 200, // 隨機分佈在樹的上方
                y: -10 - Math.random() * 150, // 從畫面頂端外開始掉
                vy: 4 + Math.random() * 4,    // 掉落速度
                radius: 2 + Math.random() * 2
            });
        }
        if (!isAnimating) animate();
    }

    function updateUI() {
        document.getElementById('days').textContent = waterCount;
        const progressPercent = Math.min(100, Math.round((waterCount / MAX_DAYS) * 100));
        document.getElementById('progress').textContent = `${progressPercent}%`;

        const today = getTodayString();
        const waterBtn = document.getElementById('waterBtn');
        const messageEl = document.getElementById('message');

        if (lastWateredDate === today) {
            waterBtn.disabled = true;
            messageEl.textContent = '🌱 今天已經澆過水囉！樹木正在吸收養分，明天再來吧。';
        } else {
            waterBtn.disabled = false;
            messageEl.textContent = '💧 小樹今天需要喝水，快點擊按鈕進行澆水！';
        }
    }

    function waterTree() {
        const today = getTodayString();
        if (lastWateredDate !== today) {
            waterCount++;
            lastWateredDate = today;

            localStorage.setItem('canvasTree_days', waterCount);
            localStorage.setItem('canvasTree_lastDate', lastWateredDate);

            targetGrowth = waterCount;
            
            updateUI();
            createWaterAnimation(); // 觸發澆水水滴動畫
        }
    }

    function resetTree() {
        if (confirm('確定要清除紀錄，重新種植一顆新樹嗎？')) {
            localStorage.removeItem('canvasTree_days');
            localStorage.removeItem('canvasTree_lastDate');
            
            // 重新給定一顆新種子，讓下一顆樹長得不一樣
            treeSeed = Math.floor(Math.random() * 100000);
            localStorage.setItem('canvasTree_seed', treeSeed);

            waterCount = 0;
            lastWateredDate = '';
            targetGrowth = 0;
            currentGrowth = 0;
            
            updateUI();
            if (!isAnimating) animate();
        }
    }

    // 初始化執行
    updateUI();
    render();
</script>

</body>
</html>
