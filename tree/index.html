<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《餐桌大森林》：吃蔬食，種出你的奇蹟樹</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f2f7f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .app-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(46, 90, 53, 0.08);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #e8f2ea;
        }
        .header {
            padding: 20px 20px 14px;
            background: linear-gradient(180deg, #eaf5ec 0%, #ffffff 100%);
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #2d6a3f;
            letter-spacing: 1px;
        }
        .user-bar {
            margin-top: 10px;
            font-size: 12px;
            color: #557c60;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.85);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #d8ebdcd0;
        }
        .user-info {
            font-weight: 500;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }
        .sync-btn {
            color: #2d6a3f;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            background: #e8f5e9;
            padding: 4px 10px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .sync-btn:hover {
            background: #c8e6c9;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 14px;
            color: #388e3c;
            font-size: 13px;
        }
        .stat-box strong {
            display: block;
            font-size: 19px;
            color: #1b5e20;
            margin-top: 2px;
        }
        .canvas-container {
            position: relative;
            background: linear-gradient(to bottom, #eef7f2 0%, #ffffff 75%, #ebdcd0 75%, #d8beac 100%);
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        canvas { display: block; }
        .controls { padding: 20px; }
        .btn-action {
            background: linear-gradient(135deg, #52c41a, #389e0d);
            color: white;
            border: none;
            padding: 15px 28px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(82, 196, 26, 0.35);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            max-width: 320px;
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 22px rgba(82, 196, 26, 0.45);
        }
        .btn-action:disabled {
            background: #cccccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn-harvest {
            background: linear-gradient(135deg, #ff922b, #f59f00) !important;
            box-shadow: 0 6px 18px rgba(245, 159, 0, 0.4) !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .message {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
            min-height: 18px;
        }
        .gallery-section {
            border-top: 1px dashed #e0e0e0;
            padding: 16px 20px 22px;
            background: #fafafa;
        }
        .gallery-title {
            font-size: 14px;
            font-weight: bold;
            color: #2d6a3f;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .animals-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .animal-card {
            background: #ffffff;
            border: 1px solid #e2ece4;
            border-radius: 14px;
            padding: 10px 4px;
            font-size: 11px;
            color: #888;
        }
        .animal-card.unlocked {
            border-color: #a5d6a7;
            background: #f1f8e9;
            color: #2e7d32;
            font-weight: bold;
        }
        .animal-icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
            filter: grayscale(100%);
            opacity: 0.25;
        }
        .animal-card.unlocked .animal-icon {
            filter: grayscale(0%);
            opacity: 1;
        }
        .sync-status {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>🥗 餐桌大森林</h1>
        <div class="user-bar">
            <div class="user-info">👤 玩家：<strong id="displayNickname">尚未設定</strong></div>
            <span class="sync-btn" onclick="switchAccountPrompt()">🔄 切換/登入帳號</span>
        </div>
        <div class="stats">
            <div class="stat-box">今日蔬食<strong id="todayVeg">0 / 3 次</strong></div>
            <div class="stat-box">奇蹟樹進度<strong id="progress">0 / 15</strong></div>
            <div class="stat-box">累積大樹<strong id="treeCount">0 棵</strong></div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="treeCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="actionBtn" class="btn-action" onclick="handleAction()">🥗 我今天吃蔬食</button>
        <div id="message" class="message"></div>
        <div id="syncStatus" class="sync-status"></div>
    </div>

    <div class="gallery-section">
        <div class="gallery-title">
            <span>🐾 森林動物圖鑑</span>
            <span id="animalProgress" style="font-size:12px; font-weight:normal; color:#666;">(0/4 解鎖)</span>
        </div>
        <div class="animals-grid" id="animalsGrid"></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRilBMphU9Ck8ScCDmlMUwM7eN0BgzcEloteFi8YoO7TSlosgZNDIQRxQObPqBVToz/exec";

    const MAX_DAILY_CLICKS = 3;
    const MAX_TREE_CLICKS = 15;

    const ANIMAL_LIST = [
        { name: "萌萌兔", icon: "🐰", requiredTrees: 3 },
        { name: "靈巧松鼠", icon: "🐿️", requiredTrees: 6 },
        { name: "溫和梅花鹿", icon: "🦌", requiredTrees: 9 },
        { name: "溫馨刺蝟", icon: "🦔", requiredTrees: 12 }
    ];

    // 🔗 預載 15 張 GitHub 圖片素材 (方案 B: 讀取 JPG 並用 multiply 去除白框)
    const TREE_IMAGE_BASE_URL = "https://paymiou.github.io/toaf-veget/tree/tree";
    const treeImages = [];
    for (let i = 1; i <= 15; i++) {
        const img = new Image();
        img.src = `${TREE_IMAGE_BASE_URL}${i}.jpg`;
        treeImages.push(img);
    }

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const logicalWidth = 400;
    const logicalHeight = 350;
    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = '100%';
    canvas.style.maxWidth = `${logicalWidth}px`;
    canvas.style.height = `${logicalHeight}px`;
    canvas.width = logicalWidth * dpr;
    canvas.height = logicalHeight * dpr;
    ctx.scale(dpr, dpr);

    let nickname = localStorage.getItem('veg_nickname') || '';
    let pin = localStorage.getItem('veg_pin') || '';
    let seminarClass = localStorage.getItem('veg_seminarClass') || '';
    let todayClicks = parseInt(localStorage.getItem('veg_todayClicks')) || 0;
    let lastDate = localStorage.getItem('veg_lastDate') || '';
    let currentTreeClicks = parseInt(localStorage.getItem('veg_currentTreeClicks')) || 0;
    let totalTreesCollected = parseInt(localStorage.getItem('veg_treesCollected')) || 0;

    let currentGrowth = currentTreeClicks;
    let targetGrowth = currentTreeClicks;
    let particles = [];
    let windAngle = 0;
    let bounceScale = 1;

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    }

    function checkUserCredentials() {
        if (!nickname || !pin || !seminarClass) {
            nickname = prompt('歡迎來到《餐桌大森林》！請輸入您的「暱稱」：') || `蔬食愛好者${Math.floor(Math.random()*1000)}`;
            pin = prompt('請輸入您的「手機後 3 碼」（用於換手機時撈回進度）：') || '000';
            seminarClass = prompt('請輸入您的「研討班資料」（例如：南14廣001）：') || '未填寫';
            
            localStorage.setItem('veg_nickname', nickname);
            localStorage.setItem('veg_pin', pin);
            localStorage.setItem('veg_seminarClass', seminarClass);
        }
        document.getElementById('displayNickname').textContent = `${nickname} (${seminarClass})`;
    }

    function checkDailyReset() {
        const today = getTodayString();
        if (lastDate !== today) {
            todayClicks = 0;
            lastDate = today;
            saveLocalData();
        }
    }

    function saveLocalData() {
        localStorage.setItem('veg_todayClicks', todayClicks);
        localStorage.setItem('veg_lastDate', lastDate);
        localStorage.setItem('veg_currentTreeClicks', currentTreeClicks);
        localStorage.setItem('veg_treesCollected', totalTreesCollected);
        localStorage.setItem('veg_seminarClass', seminarClass);
    }

    function syncToGoogleSheet() {
        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = '☁️ 正在同步進度至雲端...';

        const payload = {
            nickname: nickname,
            pin: pin,
            seminarClass: seminarClass,
            todayClicks: todayClicks,
            currentTreeClicks: currentTreeClicks,
            totalTreesCollected: totalTreesCollected,
            treeSeed: 12345
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                statusEl.textContent = '✅ 已成功同步至 Google 試算表';
            } else {
                statusEl.textContent = '⚠️ 雲端同步回應異常';
            }
            setTimeout(() => { statusEl.textContent = ''; }, 3000);
        })
        .catch(() => {
            statusEl.textContent = '⚠️ 網路連線問題，資料已先存於本機';
            setTimeout(() => { statusEl.textContent = ''; }, 3000);
        });
    }

    function switchAccountPrompt() {
        const inputNk = prompt('請輸入要登入/切換的「暱稱」：', nickname);
        if (!inputNk) return;
        const inputPin = prompt('請輸入對應的「手機後 3 碼」：', pin);
        if (!inputPin) return;

        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = '🔍 正在切換帳號並查詢雲端進度...';

        fetch(`${GOOGLE_SCRIPT_URL}?nickname=${encodeURIComponent(inputNk)}&pin=${encodeURIComponent(inputPin)}`)
        .then(res => res.json())
        .then(res => {
            if (res.status === 'success') {
                const data = res.data;
                nickname = data.nickname;
                pin = data.pin;
                seminarClass = data.seminarClass || '未填寫';
                todayClicks = Number(data.todayClicks);
                currentTreeClicks = Number(data.currentTreeClicks);
                totalTreesCollected = Number(data.totalTreesCollected);

                localStorage.setItem('veg_nickname', nickname);
                localStorage.setItem('veg_pin', pin);
                localStorage.setItem('veg_seminarClass', seminarClass);
                saveLocalData();

                targetGrowth = currentTreeClicks;
                currentGrowth = currentTreeClicks;

                checkUserCredentials();
                updateUI();
                alert(`🎉 成功登入帳號！歡迎回到餐桌大森林，${nickname} (${seminarClass})！`);
            } else {
                if (confirm(`❌ 雲端找不到暱稱「${inputNk}」與號碼「${inputPin}」的資料。\n是否要建立【全新帳號】？`)) {
                    const inputClass = prompt('請輸入新帳號的「研討班資料」（例如：南14廣001）：') || '未填寫';
                    
                    nickname = inputNk;
                    pin = inputPin;
                    seminarClass = inputClass;
                    todayClicks = 0;
                    currentTreeClicks = 0;
                    totalTreesCollected = 0;

                    localStorage.setItem('veg_nickname', nickname);
                    localStorage.setItem('veg_pin', pin);
                    localStorage.setItem('veg_seminarClass', seminarClass);
                    saveLocalData();
                    syncToGoogleSheet();

                    targetGrowth = 0;
                    currentGrowth = 0;

                    checkUserCredentials();
                    updateUI();
                    alert(`✨ 成功建立新帳號「${nickname}」！`);
                }
            }
            statusEl.textContent = '';
        })
        .catch(() => {
            alert('⚠️ 帳號連線切換失敗，請確認網路連線。');
            statusEl.textContent = '';
        });
    }

    // 🖼️ 渲染圖片樹木
    function drawImageTree(growth, wind) {
        ctx.save();
        
        // 地面柔和陰影
        const shadowW = Math.min(80, 20 + growth * 4);
        ctx.fillStyle = 'rgba(120, 100, 80, 0.15)';
        ctx.beginPath();
        ctx.ellipse(200, 315, shadowW, shadowW * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();

        // 決定對應的階段圖片 (1~15)
        const stageIndex = Math.min(14, Math.max(0, Math.floor(growth) - 1));
        const currentImg = treeImages[stageIndex];

        if (currentImg && currentImg.complete) {
            ctx.translate(200, 315);
            ctx.scale(1 / bounceScale, bounceScale);
            
            const sway = Math.sin(wind) * (0.015 + growth * 0.001);
            ctx.rotate(sway);

            // 使用 multiply 混合模式消除 JPG 白邊
            ctx.globalCompositeOperation = 'multiply';

            const imgSize = 250;
            ctx.drawImage(currentImg, -imgSize / 2, -imgSize + 10, imgSize, imgSize);
        }

        ctx.restore();
    }

    function mainLoop() {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        windAngle += 0.03;

        if (Math.abs(targetGrowth - currentGrowth) > 0.01) {
            currentGrowth += (targetGrowth - currentGrowth) * 0.06;
        } else {
            currentGrowth = targetGrowth;
        }

        if (bounceScale > 1) {
            bounceScale -= 0.015;
        } else {
            bounceScale = 1;
        }

        drawImageTree(currentGrowth, windAngle);

        if (particles.length > 0) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.y += p.vy;
                p.x += p.vx + Math.sin(windAngle * 2) * 0.5;
                p.opacity -= 0.012;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.font = `${p.size}px sans-serif`;
                ctx.fillText(p.char, p.x, p.y);
                ctx.restore();

                if (p.y > 320 || p.opacity <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        requestAnimationFrame(mainLoop);
    }

    function triggerVeggieParticles() {
        bounceScale = 1.15;
        const chars = ['🥬', '🥦', '🥗', '🍃', '✨', '💚'];
        for (let i = 0; i < 22; i++) {
            particles.push({
                x: 120 + Math.random() * 160,
                y: 100 + Math.random() * 80,
                vx: (Math.random() - 0.5) * 2,
                vy: -2 - Math.random() * 3,
                size: 14 + Math.random() * 10,
                char: chars[Math.floor(Math.random() * chars.length)],
                opacity: 1
            });
        }
    }

    function updateUI() {
        checkDailyReset();

        document.getElementById('todayVeg').textContent = `${todayClicks} / ${MAX_DAILY_CLICKS} 次`;
        document.getElementById('progress').textContent = `${currentTreeClicks} / ${MAX_TREE_CLICKS}`;
        document.getElementById('treeCount').textContent = `${totalTreesCollected} 棵`;

        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');

        if (currentTreeClicks >= MAX_TREE_CLICKS) {
            actionBtn.disabled = false;
            actionBtn.classList.add('btn-harvest');
            actionBtn.textContent = '🎉 奇蹟樹完熟！點擊收穫並種植新樹';
            messageEl.textContent = '🌟 太棒了！您的蔬食行動讓奇蹟樹茁壯長成成熟大樹囉！';
        } else if (todayClicks >= MAX_DAILY_CLICKS) {
            actionBtn.disabled = true;
            actionBtn.classList.remove('btn-harvest');
            actionBtn.textContent = '🥗 今天蔬食次數已達上限';
            messageEl.textContent = '👏 今天已完成 3 次蔬食紀錄！奇蹟樹正在吸收養分，明天繼續加油！';
        } else {
            actionBtn.disabled = false;
            actionBtn.classList.remove('btn-harvest');
            const remaining = MAX_DAILY_CLICKS - todayClicks;
            actionBtn.textContent = `🥗 我今天吃蔬食 (剩 ${remaining} 次)`;
            messageEl.textContent = `🌱 每吃一餐蔬食點一次，照顧奇蹟樹健康成長 (每天限 ${MAX_DAILY_CLICKS} 次)`;
        }

        renderGallery();
    }

    function renderGallery() {
        const grid = document.getElementById('animalsGrid');
        grid.innerHTML = '';
        let unlockedCount = 0;

        ANIMAL_LIST.forEach(animal => {
            const isUnlocked = totalTreesCollected >= animal.requiredTrees;
            if (isUnlocked) unlockedCount++;

            const card = document.createElement('div');
            card.className = `animal-card ${isUnlocked ? 'unlocked' : ''}`;
            card.innerHTML = `
                <span class="animal-icon">${animal.icon}</span>
                <div>${animal.name}</div>
                <div style="font-size:9px; margin-top:2px; color:${isUnlocked ? '#389e0d' : '#999'};">
                    ${isUnlocked ? '已解鎖' : `${animal.requiredTrees} 棵樹`}
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('animalProgress').textContent = `(${unlockedCount}/${ANIMAL_LIST.length} 解鎖)`;
    }

    function handleAction() {
        checkDailyReset();

        if (currentTreeClicks >= MAX_TREE_CLICKS) {
            totalTreesCollected++;
            currentTreeClicks = 0;
            targetGrowth = 0;
            currentGrowth = 0;

            saveLocalData();
            syncToGoogleSheet();
            updateUI();

            alert('🌳 恭喜收穫 1 棵奇蹟大樹！已寫入餐桌大森林雲端圖鑑，並準備好種植下一顆新種子囉！');
            return;
        }

        if (todayClicks < MAX_DAILY_CLICKS && currentTreeClicks < MAX_TREE_CLICKS) {
            todayClicks++;
            currentTreeClicks++;
            targetGrowth = currentTreeClicks;

            saveLocalData();
            syncToGoogleSheet();
            updateUI();
            triggerVeggieParticles();
        }
    }

    // 初始化流程
    checkUserCredentials();
    checkDailyReset();
    updateUI();
    mainLoop();
</script>

</body>
</html>
